# Agent Control Plane 2.0 — one-command full platform.
#
#   docker compose up -d
#
# Brings up:
#   - controlplane  : the app (console + API + OPA + agent worker in one image)
#   - DataHub stack : mysql, opensearch, kafka, datahub-gms (:18080),
#                     datahub-actions, frontend UI (:9002)
#
# The console connects to DataHub automatically via DATAHUB_ENDPOINT, and OPA
# runs inside the controlplane container (127.0.0.1:8181). Env knobs live in
# the repo-root .env file (DATAHUB_VERSION, ports, ...).
#
# Needs ~8 GB RAM (DataHub: JVM GMS + OpenSearch + Kafka + MySQL).
# Stop everything:  docker compose down -v   (add -v to drop DataHub volumes)
name: controlplane

include:
  # DataHub quickstart stack (pinned v1.7.0, see .env DATAHUB_VERSION)
  - path: deploy/datahub/docker-compose.datahub.yml

services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    image: controlplane:latest
    restart: unless-stopped
    ports:
      - "${CONTROLPLANE_PORT:-8080}:8080"
    depends_on:
      datahub-gms-quickstart:
        condition: service_healthy
    environment:
      CONTROLPLANE_POLICY_ENGINE: opa
      CONTROLPLANE_OPA_URL: http://127.0.0.1:8181
      CONTROLPLANE_RUN_WORKER: "true"
      CONTROLPLANE_TELEMETRY_EXPORTER: file
      DATAHUB_ENDPOINT: http://datahub-gms:8080
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      LLM_MODEL: ${LLM_MODEL:-openrouter/anthropic/claude-3.5-sonnet}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - controlplane-data:/app/backend/data

volumes:
  controlplane-data:
