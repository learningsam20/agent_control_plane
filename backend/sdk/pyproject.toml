[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlplane-sdk"
version = "0.1.0"
description = "Agent SDK for the Agent Control Plane 2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "cryptography>=42.0"]

[tool.setuptools]
packages = ["controlplane"]
